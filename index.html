<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简待办清单 (Todo App)</title>
  <style>
    :root {
      --bg-color: #f5f6f8;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-muted: #888888;
      --primary: #4f46e5;
      --border-color: #e5e7eb;
      --completed-color: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      text-align: center;
    }

    .todo-form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .todo-input {
      flex: 1;
      padding: 10px 14px;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    .todo-input:focus {
      border-color: var(--primary);
    }

    .btn-add {
      padding: 10px 18px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 500;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #fafafa;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .todo-item-content {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .todo-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .todo-title {
      font-size: 0.95rem;
      word-break: break-word;
    }

    .todo-item.completed .todo-title {
      text-decoration: line-through;
      color: var(--completed-color);
    }

    .todo-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: 10px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 30px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>待办事项清单</h1>
      <p class="subtitle">极简原生 HTML + JS 实现</p>
    </header>

    <div class="todo-form">
      <input type="text" id="newTodoInput" class="todo-input" placeholder="输入新的待办事项..." />
      <button id="addTodoBtn" class="btn-add">添加</button>
    </div>

    <ul id="todoList" class="todo-list">
      <!-- 待办项动态渲染 -->
    </ul>
  </div>

  <script>
    // 1. 本地 Mock 假数据（符合之前约定的 TodoItem 结构）
    const mockTodos = [
      {
        id: "1",
        title: "购买日用品",
        completed: false,
        createdAt: "2026-09-23T10:00:00Z",
        updatedAt: "2026-09-23T10:00:00Z"
      },
      {
        id: "2",
        title: "完成项目架构设计",
        completed: true,
        createdAt: "2026-09-23T09:30:00Z",
        updatedAt: "2026-09-23T09:50:00Z"
      },
      {
        id: "3",
        title: "阅读设计模式第三章",
        completed: false,
        createdAt: "2026-09-23T11:00:00Z",
        updatedAt: "2026-09-23T11:00:00Z"
      }
    ];

    // 全局待办状态数据
    let todos = [];

    // DOM 元素引用
    const todoListElement = document.getElementById("todoList");

    /**
     * 渲染待办列表到页面
     * @param {Array} items 
     */
    function renderTodos(items) {
      if (!items || items.length === 0) {
        todoListElement.innerHTML = '<li class="empty-state">暂无待办事项</li>';
        return;
      }

      todoListElement.innerHTML = items
        .map(todo => {
          const formattedDate = new Date(todo.createdAt).toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
          });
          return `
            <li class="todo-item ${todo.completed ? "completed" : ""}" data-id="${todo.id}">
              <div class="todo-item-content">
                <input 
                  type="checkbox" 
                  class="todo-checkbox" 
                  ${todo.completed ? "checked" : ""}
                  disabled
                />
                <span class="todo-title">${escapeHtml(todo.title)}</span>
              </div>
              <span class="todo-meta">${formattedDate}</span>
            </li>
          `;
        })
        .join("");
    }

    /**
     * 转义 HTML 防止 XSS
     */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /**
     * 标准 fetchTodos 函数：预留向后端 GET /api/todos 发起请求的逻辑
     * 后端未就绪时自动 fallback 到 mockTodos 进行渲染
     */
    async function fetchTodos() {
      const API_URL = "http://localhost:3001/api/todos";
      try {
        const response = await fetch(API_URL, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const resData = await response.json();
        // 约定响应格式: { code: 0, message: "success", data: [...] }
        if (resData && resData.code === 0 && Array.isArray(resData.data)) {
          todos = resData.data;
          renderTodos(todos);
          return;
        }
        throw new Error("Invalid response format");
      } catch (err) {
        console.warn(`[fetchTodos] 后端服务未就绪或请求失败 (${err.message})，降级使用假数据展示。`);
        // 使用假数据兜底展示
        todos = [...mockTodos];
        renderTodos(todos);
      }
    }

    // 页面初始化时执行
    document.addEventListener("DOMContentLoaded", () => {
      fetchTodos();
    });
  </script>
</body>
</html>
