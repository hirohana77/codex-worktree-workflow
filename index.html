<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简待办清单 (Todo App)</title>
  <!-- 引入组件独立样式 -->
  <link rel="stylesheet" href="client/components/todo-input/todo-input.css">
  <link rel="stylesheet" href="client/components/todo-footer/todo-footer.css">
  <style>
    :root {
      --bg-color: #f5f6f8;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-muted: #888888;
      --primary: #4f46e5;
      --border-color: #e5e7eb;
      --completed-color: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      margin-bottom: 4px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      text-align: center;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 48px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #fafafa;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
      user-select: none;
    }

    .todo-item:hover {
      background: #f3f4f6;
    }

    .todo-item-content {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .todo-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .todo-title {
      font-size: 0.95rem;
      word-break: break-word;
      transition: color 0.2s;
    }

    .todo-item.completed .todo-title {
      text-decoration: line-through;
      color: var(--completed-color);
    }

    .todo-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: 10px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 30px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>待办事项清单</h1>
      <p class="subtitle">极简原生 HTML + JS 组件化实现</p>
    </header>

    <!-- TodoInput 组件挂载容器 -->
    <div id="todoInputContainer"></div>

    <!-- 待办列表 -->
    <ul id="todoList" class="todo-list">
      <!-- 待办项动态渲染 -->
    </ul>

    <!-- TodoFooter 组件挂载容器 -->
    <div id="todoFooterContainer"></div>
  </div>

  <!-- 引入组件逻辑 -->
  <script src="client/components/todo-input/todo-input.js"></script>
  <script src="client/components/todo-footer/todo-footer.js"></script>

  <script>
    // 1. 本地初始/兜底数据（符合 TodoItem 结构规范）
    const initialMockTodos = [
      {
        id: "1",
        title: "购买日用品",
        completed: false,
        createdAt: "2026-09-23T10:00:00Z",
        updatedAt: "2026-09-23T10:00:00Z"
      },
      {
        id: "2",
        title: "完成项目架构设计",
        completed: true,
        createdAt: "2026-09-23T09:30:00Z",
        updatedAt: "2026-09-23T09:50:00Z"
      },
      {
        id: "3",
        title: "阅读设计模式第三章",
        completed: false,
        createdAt: "2026-09-23T11:00:00Z",
        updatedAt: "2026-09-23T11:00:00Z"
      }
    ];

    // 全局状态
    let todos = [];
    let currentFilter = 'all'; // 'all' | 'active' | 'completed'

    // 组件实例引用
    let todoInputInstance = null;
    let todoFooterInstance = null;

    // DOM 元素引用
    const todoListElement = document.getElementById("todoList");
    const todoInputContainer = document.getElementById("todoInputContainer");
    const todoFooterContainer = document.getElementById("todoFooterContainer");

    /**
     * 过滤待办数据
     */
    function getFilteredTodos() {
      if (currentFilter === 'active') {
        return todos.filter(t => !t.completed);
      }
      if (currentFilter === 'completed') {
        return todos.filter(t => t.completed);
      }
      return todos;
    }

    /**
     * 更新 Footer 统计
     */
    function updateFooterStats() {
      if (!todoFooterInstance) return;
      const activeCount = todos.filter(t => !t.completed).length;
      const completedCount = todos.filter(t => t.completed).length;
      todoFooterInstance.update({
        activeCount: activeCount,
        completedCount: completedCount
      });
    }

    /**
     * 渲染待办列表到页面
     */
    function render() {
      const items = getFilteredTodos();
      if (!items || items.length === 0) {
        let emptyTip = '暂无待办事项';
        if (currentFilter === 'active') emptyTip = '没有未完成的待办事项';
        if (currentFilter === 'completed') emptyTip = '没有已完成的待办事项';
        todoListElement.innerHTML = `<li class="empty-state">${emptyTip}</li>`;
      } else {
        todoListElement.innerHTML = items
          .map(todo => {
            const formattedDate = new Date(todo.createdAt).toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit"
            });
            return `
              <li class="todo-item ${todo.completed ? "completed" : ""}" data-id="${todo.id}">
                <div class="todo-item-content">
                  <input 
                    type="checkbox" 
                    class="todo-checkbox" 
                    ${todo.completed ? "checked" : ""}
                  />
                  <span class="todo-title">${escapeHtml(todo.title)}</span>
                </div>
                <span class="todo-meta">${formattedDate}</span>
              </li>
            `;
          })
          .join("");
      }

      updateFooterStats();
    }

    /**
     * 转义 HTML 防止 XSS
     */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /**
     * 切换待办状态
     */
    function toggleTodoStatus(id) {
      const target = todos.find(t => t.id === id);
      if (target) {
        target.completed = !target.completed;
        target.updatedAt = new Date().toISOString();
        render();
      }
    }

    /**
     * 处理新增待办事项
     */
    async function handleAddTodo(title) {
      const newTodo = {
        id: Date.now().toString(),
        title: title,
        completed: false,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      // 向后发起创建请求（预留向后端发送 POST /api/todos）
      try {
        await fetch("http://localhost:3000/api/todos", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({ title: title })
        });
      } catch (e) {
        // 后端若未实现 POST 路由或未启动服务，保持前端正常添加体验
        console.warn("[handleAddTodo] 异步同步服务端跳过 (接口未就绪或未启动):", e.message);
      }

      // 本地状态变更并更新视图
      todos.unshift(newTodo);
      render();
    }

    /**
     * 清理所有已完成待办
     */
    function handleClearCompleted() {
      todos = todos.filter(t => !t.completed);
      render();
    }

    /**
     * 请求后端 GET /api/todos
     */
    async function fetchTodos() {
      const API_URL = "http://localhost:3000/api/todos";
      try {
        const response = await fetch(API_URL, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const resData = await response.json();
        if (resData && resData.code === 0 && Array.isArray(resData.data) && resData.data.length > 0) {
          todos = resData.data;
        } else {
          // 若后端返回空列表，使用演示初始数据提供良好首屏体验
          todos = [...initialMockTodos];
        }
      } catch (err) {
        console.warn(`[fetchTodos] 后端服务未就绪 (${err.message})，使用演示数据展示。`);
        todos = [...initialMockTodos];
      }
      render();
    }

    // 事件委托绑定列表内点击与 checkbox 切换
    todoListElement.addEventListener('click', (e) => {
      const itemEl = e.target.closest('.todo-item');
      if (!itemEl) return;
      const todoId = itemEl.getAttribute('data-id');
      toggleTodoStatus(todoId);
    });

    // 页面初始化
    document.addEventListener("DOMContentLoaded", () => {
      // 1. 实例化 TodoInput 组件
      if (typeof window.createTodoInput === 'function') {
        todoInputInstance = window.createTodoInput(todoInputContainer, {
          placeholder: '想做点什么？输入后按回车或点击添加',
          onSubmit: handleAddTodo
        });
      }

      // 2. 实例化 TodoFooter 组件
      if (typeof window.createTodoFooter === 'function') {
        todoFooterInstance = window.createTodoFooter(todoFooterContainer, {
          activeFilter: currentFilter,
          onFilterChange: (newFilter) => {
            currentFilter = newFilter;
            render();
          },
          onClearCompleted: handleClearCompleted
        });
      }

      // 3. 拉取并初次渲染
      fetchTodos();
    });
  </script>
</body>
</html>
