<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>TodoFooter Demo & Testing</title>
  <link rel="stylesheet" href="todo-footer.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 40px 20px;
      background-color: #f7fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .demo-card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }
    .demo-content {
      padding: 20px;
      color: #4a5568;
    }
    .controls {
      margin-top: 24px;
      display: flex;
      gap: 10px;
    }
    .controls button {
      padding: 6px 12px;
      cursor: pointer;
    }
    .log-panel {
      margin-top: 16px;
      width: 100%;
      max-width: 520px;
      background: #2d3748;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <h2>TodoFooter 独立组件测试 Demo</h2>

  <div class="demo-card">
    <div class="demo-content">
      <p>待办内容区域模拟...</p>
    </div>
    <div id="footer-container"></div>
  </div>

  <div class="controls">
    <button id="btn-add">模拟新增1个未完成</button>
    <button id="btn-toggle">模拟完成1个待办</button>
    <button id="btn-set-completed">外部设过滤为已完成</button>
  </div>

  <div class="log-panel" id="log-output">
    Event Log: 初始化就绪
  </div>

  <script src="todo-footer.js"></script>
  <script>
    var logEl = document.getElementById('log-output');
    function log(msg) {
      logEl.innerHTML += '<br>' + new Date().toLocaleTimeString() + ' - ' + msg;
    }

    var state = {
      activeCount: 3,
      completedCount: 2
    };

    var footer = window.createTodoFooter(document.getElementById('footer-container'), {
      activeFilter: 'all',
      onFilterChange: function(filter) {
        log('【事件触发】onFilterChange: ' + filter);
      },
      onClearCompleted: function() {
        log('【事件触发】onClearCompleted 点击');
        state.completedCount = 0;
        footer.update(state);
      }
    });

    // 初始状态灌入
    footer.update(state);

    document.getElementById('btn-add').addEventListener('click', function() {
      state.activeCount++;
      footer.update(state);
      log('更新状态: activeCount = ' + state.activeCount);
    });

    document.getElementById('btn-toggle').addEventListener('click', function() {
      if (state.activeCount > 0) {
        state.activeCount--;
        state.completedCount++;
        footer.update(state);
        log('更新状态: activeCount = ' + state.activeCount + ', completedCount = ' + state.completedCount);
      }
    });

    document.getElementById('btn-set-completed').addEventListener('click', function() {
      footer.setFilter('completed');
      log('外部调用 setFilter("completed")');
    });
  </script>
</body>
</html>
